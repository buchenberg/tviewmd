runner:
  timeout: 5m
  concurrency: 4
  issues-exit-code: 1
  tests: false

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable:
    - errcheck
    - gofmt
    - goimports
    - gosec
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - bodyclose
    - dogsled
    - dupl
    - durationcheck
    - errorlint
    - exhaustive
    - exportloopref
    - funlen
    - gci
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goerr113
    - ifshort
    - importas
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - stylecheck
    - tenv
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - wastedassign
    - whitespace

linters-settings:
  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/buchenberg

  gci:
    local-prefixes: github.com/buchenberg

  gocognit:
    min-complexity: 15

  gocyclo:
    min-complexity: 15

  godot:
    capital: false

  lll:
    line-length: 120
    tab-length: 4

  misspell:
    locale: US

  revive:
    confidence: 0.8
    severity: warning
    rules:
      - name: exported
        disabled: false
      - name: package-comments
        disabled: false

issues:
  exclude-rules:
    - linters:
        - lll
      source: "^//go:generate" }