version: "2"

run:
  timeout: 5m
  tests: false

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - dupl
    - durationcheck
    - copyloopvar
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - funlen
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - whitespace
  settings:
    exhaustive:
      # Switches here end in a default that returns the canonical fallback, so a
      # default clause means the case list is complete on purpose.
      default-signifies-exhaustive: true
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    godot:
      capital: false
    lll:
      line-length: 120
    misspell:
      locale: US
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    rules:
      - linters:
          - lll
        source: "^//go:generate"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/buchenberg
